<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect for /POS/
      // Takes /POS/sales-journal -> /POS/?/sales-journal
      var segmentCount = 1; // "POS" is 1 segment
      var l = window.location;
      var path =
        l.pathname
          .split('/')
          .slice(0, 1 + segmentCount)
          .join('/') + '/';
      var rest = l.pathname
        .split('/')
        .slice(1 + segmentCount)
        .join('/');
      var newUrl =
        l.protocol +
        '//' +
        l.host +
        path +
        '?/' +
        rest +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash;
      l.replace(newUrl);
    </script>
  </head>
  <body></body>
</html>
